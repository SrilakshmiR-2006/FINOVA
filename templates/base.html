<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}finova — Finance analytics & budget tracking{% endblock %}</title>
  <meta name="description" content="{% block desc %}Track income, expenses and savings with clear financial reports.{% endblock %}">
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/favicon.svg') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <meta name="csrf" content="{{ csrf_token() }}">
</head>
<body>
  <div id="toasts"></div>
  {% block body %}{% endblock %}
  <script>
    window.__FLASH__ = {{ get_flashed_messages(with_categories=true) | tojson }};
  </script>
  <script src="{{ url_for('static', filename='js/common.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
